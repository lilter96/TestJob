name: testjob

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: testjob
      POSTGRES_USER: testjob
      POSTGRES_PASSWORD: testjob
    volumes:
      # PG18 keeps PGDATA in /var/lib/postgresql/18/docker, so mount the parent, not .../data
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testjob -d testjob"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    restart: unless-stopped
    working_dir: /app
    # Sources are mounted; build and run on every container start.
    command: ["dotnet", "run", "-c", "Release", "--no-launch-profile"]
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=testjob;Username=testjob;Password=testjob
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    volumes:
      - ./src/TestJob.Api:/app
      - api-bin:/app/bin
      - api-obj:/app/obj
      - nuget-cache:/root/.nuget/packages
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # No pgAdmin login and no master password.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGPASS_FILE: /pgpass
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin-data:
  api-bin:
  api-obj:
  nuget-cache:
